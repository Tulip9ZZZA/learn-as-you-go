<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Before and After learn-as-you-go</title>
  <desc id="desc">Comparison showing how a tangent question derails a build without the skill versus closing cleanly in under a screen with learn-as-you-go.</desc>
  <rect width="1200" height="330" rx="24" fill="#0B0F17"/>

  <g transform="translate(40 32)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <rect width="540" height="266" rx="18" fill="#18121E" stroke="#7F1D1D" stroke-width="2"/>
    <rect x="24" y="22" width="210" height="30" rx="6" fill="#450A0A"/>
    <text x="38" y="42" fill="#FCA5A5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">✗ WITHOUT LEARN-AS-YOU-GO</text>

    <text x="24" y="84" fill="#F8FAFC" font-size="22" font-weight="700">The 600-Token Tangent Derail</text>
    <text x="24" y="118" fill="#CBD5E1" font-size="18">• Restates your question with polite filler preamble</text>
    <text x="24" y="148" fill="#CBD5E1" font-size="18">• Dumps a 5-paragraph textbook essay and 3 examples</text>
    <text x="24" y="178" fill="#CBD5E1" font-size="18">• Re-explains the entire conversation history</text>
    <text x="24" y="208" fill="#CBD5E1" font-size="18">• Ends with "Let me know if you have questions!"</text>
    <text x="24" y="242" fill="#F87171" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">Result: Main task forgotten · Smart zone polluted</text>
  </g>

  <g transform="translate(620 32)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <rect width="540" height="266" rx="18" fill="#0D1F1C" stroke="#065F46" stroke-width="2"/>
    <rect x="24" y="22" width="196" height="30" rx="6" fill="#064E3B"/>
    <text x="38" y="42" fill="#6EE7B7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">✓ WITH LEARN-AS-YOU-GO</text>

    <text x="24" y="84" fill="#F8FAFC" font-size="22" font-weight="700">The Single-Screen Side-Answer</text>
    <text x="24" y="118" fill="#CBD5E1" font-size="18">• Leads with the direct answer in 1-3 sentences</text>
    <text x="24" y="148" fill="#CBD5E1" font-size="18">• Grounds new concepts in your active build task</text>
    <text x="24" y="178" fill="#CBD5E1" font-size="18">• Cites exactly one verifiable source pointer</text>
    <text x="24" y="208" fill="#CBD5E1" font-size="18">• Closes with: Back to &lt;task&gt;: &lt;next step&gt;</text>
    <text x="24" y="242" fill="#34D399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">Result: Question answered · Build resumes immediately</text>
  </g>
</svg>
