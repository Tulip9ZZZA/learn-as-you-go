<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">learn-as-you-go 5-Step Execution Loop</title>
  <desc id="desc">Five-step execution flow: Read Question, Answer First, Ground Term, Cite Source, and Return Explicitly.</desc>
  <rect width="1200" height="250" rx="24" fill="#0B0F17"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <text x="44" y="44" fill="#F59E0B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="2">EXECUTION PROTOCOL · 5 DETERMINISTIC STEPS</text>

    <g transform="translate(40 68)">
      <rect width="208" height="146" rx="14" fill="#131C2E" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="34" fill="#F59E0B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">01 · READ</text>
      <text x="18" y="66" fill="#F8FAFC" font-size="20" font-weight="700">Pin Intent</text>
      <text x="18" y="96" fill="#94A3B8" font-size="15">Answer likely reading;</text>
      <text x="18" y="118" fill="#94A3B8" font-size="15">name alt in 1 line.</text>
    </g>

    <g transform="translate(268 68)">
      <rect width="208" height="146" rx="14" fill="#131C2E" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="18" y="34" fill="#F59E0B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">02 · ANSWER</text>
      <text x="18" y="66" fill="#F8FAFC" font-size="20" font-weight="700">Lead Direct</text>
      <text x="18" y="96" fill="#94A3B8" font-size="15">1-3 sentences or</text>
      <text x="18" y="118" fill="#94A3B8" font-size="15">parallel bullets.</text>
    </g>

    <g transform="translate(496 68)">
      <rect width="208" height="146" rx="14" fill="#131C2E" stroke="#334155" stroke-width="1.5"/>
      <text x="18" y="34" fill="#F59E0B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">03 · GROUND</text>
      <text x="18" y="66" fill="#F8FAFC" font-size="20" font-weight="700">Tie to Task</text>
      <text x="18" y="96" fill="#94A3B8" font-size="15">1 sentence linking</text>
      <text x="18" y="118" fill="#94A3B8" font-size="15">term to active build.</text>
    </g>

    <g transform="translate(724 68)">
      <rect width="208" height="146" rx="14" fill="#131C2E" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="18" y="34" fill="#38BDF8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">04 · CITE</text>
      <text x="18" y="66" fill="#F8FAFC" font-size="20" font-weight="700">One Pointer</text>
      <text x="18" y="96" fill="#94A3B8" font-size="15">File path, URL, SHA,</text>
      <text x="18" y="118" fill="#94A3B8" font-size="15">or prior context.</text>
    </g>

    <g transform="translate(952 68)">
      <rect width="208" height="146" rx="14" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="2"/>
      <text x="18" y="34" fill="#34D399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">05 · RETURN</text>
      <text x="18" y="66" fill="#F8FAFC" font-size="20" font-weight="700">Resume Work</text>
      <text x="18" y="96" fill="#A7F3D0" font-size="15">Back to &lt;task&gt;:</text>
      <text x="18" y="118" fill="#A7F3D0" font-size="15">&lt;exact next step&gt;.</text>
    </g>
  </g>
</svg>
